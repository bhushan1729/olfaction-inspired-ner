datasets:
  conll_en:
    dataset: conll2003
    language: null
    glove_path: null
    use_pretrained_embeddings: false
  wikiann_mr:
    dataset: wikiann
    language: mr
    glove_path: null
    use_pretrained_embeddings: false
  wikiann_hi:
    dataset: wikiann
    language: hi
    glove_path: null
    use_pretrained_embeddings: false
  wikiann_ta:
    dataset: wikiann
    language: ta
    glove_path: null
    use_pretrained_embeddings: false
  wikiann_bn:
    dataset: wikiann
    language: bn
    glove_path: null
    use_pretrained_embeddings: false
  wikiann_bn_1k:
    dataset: wikiann
    language: bn
    glove_path: null
    use_pretrained_embeddings: false
    max_train_samples: 1000
  wikiann_ta_1k:
    dataset: wikiann
    language: ta
    glove_path: null
    use_pretrained_embeddings: false
    max_train_samples: 1000
  wikiann_te:
    dataset: wikiann
    language: te
    glove_path: null
    use_pretrained_embeddings: false
common_settings:
  embedding_dim: 300
  dropout: 0.2
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 30
  patience: 5
  min_freq: 2
  lambda_sparse: 0.001
  lambda_diverse: 0.01
  use_receptors: true
  use_glomeruli: true
  use_crf: true
experiments:
  baseline:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.01
    use_receptors: false
    use_glomeruli: false
    use_crf: true
    model_type: baseline
    lstm_hidden: 256
    lstm_layers: 1
  olfactory:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.01
    use_receptors: true
    use_glomeruli: true
    use_crf: true
    model_type: olfactory
    num_receptors: 128
    num_glomeruli: 32
    activation: gelu
  more_receptors:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.05
    use_receptors: true
    use_glomeruli: true
    use_crf: true
    model_type: olfactory
    num_receptors: 256
    num_glomeruli: 64
    activation: gelu
  more_glomeruli:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.01
    use_receptors: true
    use_glomeruli: true
    use_crf: true
    model_type: olfactory
    num_receptors: 128
    num_glomeruli: 64
    activation: gelu
  more_receptors_more_glomeruli:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.01
    use_receptors: true
    use_glomeruli: true
    use_crf: true
    model_type: olfactory
    num_receptors: 256
    num_glomeruli: 128
    activation: gelu
  receptors_only:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.001
    lambda_diverse: 0.01
    use_receptors: true
    use_glomeruli: false  # ABLATION: no glomeruli pooling
    use_crf: true
    model_type: olfactory
    num_receptors: 128
    activation: gelu
  no_sparsity:
    embedding_dim: 300
    dropout: 0.2
    batch_size: 32
    learning_rate: 0.001
    num_epochs: 30
    patience: 5
    min_freq: 2
    lambda_sparse: 0.0  # ABLATION: no sparsity penalty
    lambda_diverse: 0.0 # ABLATION: no diversity penalty
    use_receptors: true
    use_glomeruli: true
    use_crf: true
    model_type: olfactory
    num_receptors: 128
    num_glomeruli: 32
    activation: gelu
